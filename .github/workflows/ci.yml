name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: shellcheck install.sh

  validate:
    name: Config Syntax & Deployment Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JSON and TOML Configurations
        run: |
          python3 -c "
          import json, tomllib, glob

          for jf in glob.glob('**/*.json', recursive=True):
              with open(jf) as f:
                  json.load(f)

          for tf in glob.glob('**/*.toml', recursive=True):
              with open(tf, 'rb') as f:
                  tomllib.load(f)
          "

      - name: Test Installer Dry Run
        run: |
          TEST_HOME="$(mktemp -d)"
          TEST_CONFIG="$(mktemp -d)"
          HOME="$TEST_HOME" XDG_CONFIG_HOME="$TEST_CONFIG" bash install.sh
